# Checks are defined in the Makefile. 5.5 is the supported minimum.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["5.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-repositories: |
            open-opam: https://github.com/open-opam/opam-repository.git
            default: https://opam.ocaml.org
      # The Makefile's LOCAL: spool-dashboard takes spool at its own version.
      - run: opam install . --deps-only --with-test --with-dev-setup -y --ignore-constraints-on=deps-of-spool
      # make lint builds the dashboard's page again and compares it.
      - uses: oven-sh/setup-bun@v2
      # Use setup-ocaml's switch instead of the Makefile's.
      - run: make lint OPAM="opam exec --"
      # Compose reaches Podman through its user socket, which the runner
      # does not start.
      - run: systemctl --user start podman.socket
      - run: make test OPAM="opam exec --"

  # The oldest versions the opam file allows, as opam-repository checks.
  lower-bounds:
    runs-on: ubuntu-24.04
    env:
      OPAMCRITERIA: +removed,+count[version-lag,solution]
      OPAMFIXUPCRITERIA: +removed,+count[version-lag,solution]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-repositories: |
            open-opam: https://github.com/open-opam/opam-repository.git
            default: https://opam.ocaml.org
      - run: opam install . --deps-only --with-test -y --ignore-constraints-on=deps-of-spool
      - run: opam list --installed --columns=name,version
      - run: make build OPAM="opam exec --"
      # Compose reaches Podman through its user socket, which the runner
      # does not start.
      - run: systemctl --user start podman.socket
      - run: make test OPAM="opam exec --"
