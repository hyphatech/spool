# The test database: empty on every start (tmpfs), durability off for speed.
name: spool

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: spool
      POSTGRES_PASSWORD: spool
      POSTGRES_DB: spool
    # Not 5432, so a local Postgres is never tested by mistake.
    ports:
      - "${PG_TEST_PORT:-5439}:5432"
    tmpfs:
      - /var/lib/postgresql
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spool -d spool"]
      interval: 1s
      timeout: 3s
      retries: 30

